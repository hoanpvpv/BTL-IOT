<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Face Recognition Access Control</title>
  <style>
    /* Reset nhẹ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Body */
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #0f1720 0%, #111317 100%);
      color: #e6eef8;
      font-size: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Layout container */
    #content-left,
    #content-right {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(2, 6, 23, 0.6);
    }

    /* Responsive column/row */
    @media (min-width: 900px) {
      body {
        padding: 40px;
      }

      #content-left,
      #content-right {
        width: 460px;
      }

      #content-left {
        margin-right: 18px;
      }

      #content-right {
        margin-left: 0;
      }

      #content-left,
      #content-right {
        align-self: stretch;
      }

      #content-left {
        flex: 0 0 auto;
      }

      #content-right {
        flex: 0 0 auto;
      }

      /* make body center two cards */
      body>#content-left,
      body>#content-right {
        display: block;
      }
    }

    @media (max-width: 899px) {

      /* stack */
      #content-left,
      #content-right {
        width: 100%;
        max-width: 780px;
        margin-bottom: 14px;
      }
    }

    /* Stream container */
    #stream-container {
      background: linear-gradient(180deg, #0b1220 0%, #0f1724 100%);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
    }

    #stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Status */
    #status-display {
      height: 48px;
      padding: 8px 12px;
      font-weight: 600;
      border-radius: 10px;
      background: linear-gradient(90deg, #0ea5a3, #06b6d4);
      color: #03121a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.25);
    }

    #current-status {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Input */
    #person {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      color: #e6eef8;
      outline: none;
      margin-bottom: 10px;
      font-size: 15px;
    }

    /* Buttons grid */
    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: transform .08s ease, box-shadow .08s;
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.5);
    }

    button.left {
      background: linear-gradient(90deg, #ff6b6b, #ff3b3b);
    }

    button.right {
      background: linear-gradient(90deg, #4ade80, #16a34a);
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
      box-shadow: none;
    }

    /* People list */
    .people {
      margin-top: 6px;
    }

    .people h3 {
      margin-bottom: 8px;
      font-size: 16px;
      color: #cfe8ff;
    }

    .people ul {
      max-height: 220px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.01);
      padding: 8px;
      border-radius: 8px;
      list-style: none;
    }

    .people li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.005));
      border: 1px solid rgba(255, 255, 255, 0.02);
      gap: 12px;
    }

    .people li strong {
      font-weight: 700;
      color: #dff6ff;
    }

    .delete {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #fff;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      transition: background .12s, transform .08s;
    }

    .delete:hover {
      background: rgba(255, 48, 52, 0.12);
      transform: translateY(-2px);
    }

    /* Misc */
    .image-container {
      width: 100%;
    }

    .stream {
      display: block;
      max-width: 100%;
      border-radius: 10px;
    }

    /* Small helpers for delete-all */
    #delete_all {
      width: 100%;
      background: linear-gradient(90deg, #ef4444, #f97316);
    }
  </style>
</head>

<body>
  <div id="content-left">
    <div id="stream-container" class="image-container"> <img id="stream" src=""> </div>
  </div>
  <div id="content-right">
    <div id="status-display"> <span id="current-status"></span> </div>
    <div id="person-name">
      <input id="person" type="text" value="" placeholder="Type the person's name here">
    </div>
    <div class="buttons">
      <button id="button-stream" class="left">STREAM CAMERA</button>
      <button id="button-detect" class="right">DETECT FACES</button>
    </div>
    <div class="buttons">
      <button id="button-capture" class="left" title="Enter a name above before capturing a face">ADD
        USER</button>
      <button id="button-recognise" class="right">ACCESS CONTROL</button>
    </div>
    <div class="people">
      <h3>Captured Faces</h3>
      <ul>
      </ul>
    </div>
    <div class="buttons">
      <button id="delete_all">DELETE ALL</button>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function (event) {
      var baseHost = document.location.origin;
      var streamUrl = baseHost + ":81";
      const WS_URL = "ws://" + window.location.host + ":82";
      const ws = new WebSocket(WS_URL);

      const view = document.getElementById("stream");
      const personFormField = document.getElementById("person");
      const streamButton = document.getElementById("button-stream");
      const detectButton = document.getElementById("button-detect");
      const captureButton = document.getElementById("button-capture");
      const recogniseButton = document.getElementById("button-recognise");
      const deleteAllButton = document.getElementById("delete_all");

      // gain, frequency, duration
      a = new AudioContext();
      function alertSound(w, x, y) {
        v = a.createOscillator();
        u = a.createGain();
        v.connect(u);
        v.frequency.value = x;
        v.type = "square";
        u.connect(a.destination);
        u.gain.value = w * 0.01;
        v.start(a.currentTime);
        v.stop(a.currentTime + y * 0.001);
      }

      ws.onopen = () => {
        console.log(`Connected to ${WS_URL}`);
      };
      ws.onmessage = message => {
        if (typeof message.data === "string") {
          if (message.data.substr(0, 8) == "listface") {
            addFaceToScreen(message.data.substr(9));
          } else if (message.data == "delete_faces") {
            deleteAllFacesFromScreen();
          } else if (message.data == "door_open") {
            alertSound(10, 233, 100); alertSound(3, 603, 200);
          } else {
            document.getElementById("current-status").innerHTML = message.data;
            document.getElementById("status-display").style.background = "green";
          }
        }
        if (message.data instanceof Blob) {
          var urlObject = URL.createObjectURL(message.data);
          view.src = urlObject;
        }
      }

      streamButton.onclick = () => {
        ws.send("stream");
      };
      detectButton.onclick = () => {
        ws.send("detect");
      };
      captureButton.onclick = () => {
        person_name = document.getElementById("person").value;
        ws.send("capture:" + person_name);
      };
      recogniseButton.onclick = () => {
        ws.send("recognise");
      };
      deleteAllButton.onclick = () => {
        ws.send("delete_all");
      };
      personFormField.onkeyup = () => {
        captureButton.disabled = false;
      };

      function deleteAllFacesFromScreen() {
        // deletes face list in browser only
        const faceList = document.querySelector("ul");
        while (faceList.firstChild) {
          faceList.firstChild.remove();
        }
        personFormField.value = "";
        captureButton.disabled = true;
      }

      function addFaceToScreen(person_name) {
        const faceList = document.querySelector("ul");
        let listItem = document.createElement("li");
        let closeItem = document.createElement("span");
        closeItem.classList.add("delete");
        closeItem.id = person_name;
        closeItem.addEventListener("click", function () {
          ws.send("remove:" + person_name);
        });
        listItem.appendChild(
          document.createElement("strong")
        ).textContent = person_name;
        listItem.appendChild(closeItem).textContent = "X";
        faceList.appendChild(listItem);
      }

      captureButton.disabled = true;
    });
  </script>
</body>

</html>
